<footer id="neural-footer">
  <canvas id="neural-canvas"></canvas>

  <div class="footer-content">
    توسعه داده شده با ☕ توسط <span class="author">اسم شما</span>
  </div>
</footer>

<style>
  #neural-footer {
    position: relative;
    height: 200px;
    overflow: hidden;
    background: linear-gradient(135deg, #0a0f2c, #0d47a1, #1976d2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: "Vazirmatn", sans-serif;
    font-size: 1.1rem;
  }

  .footer-content {
    position: relative;
    z-index: 2;
    text-shadow: 0 0 12px rgba(0, 200, 255, 0.8);
    font-weight: bold;
  }

  .author {
    color: #ffdd57;
  }

  #neural-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
    pointer-events: none;
  }

  /* اسپات لایت موس */
  #neural-footer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(0, 255, 255, 0.35) 0px,
      rgba(0, 150, 255, 0.15) 150px,
      rgba(0, 0, 0, 0) 350px
    );
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 2;
  }

  #neural-footer:hover::before {
    opacity: 1;
  }
</style>

<script>
(function () {
  const footer = document.getElementById("neural-footer");
  const canvas = document.getElementById("neural-canvas");
  const ctx = canvas.getContext("2d");

  let DPR = window.devicePixelRatio || 1;
  function resizeCanvas() {
    canvas.width = footer.clientWidth * DPR;
    canvas.height = footer.clientHeight * DPR;
    canvas.style.width = footer.clientWidth + "px";
    canvas.style.height = footer.clientHeight + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const nodes = [];
  const nodeCount = Math.floor(canvas.width / 50); // تعداد بیشتر
  const areaW = () => footer.clientWidth;
  const areaH = () => footer.clientHeight;

  for (let i = 0; i < nodeCount; i++) {
    nodes.push({
      x: Math.random() * areaW(),
      y: Math.random() * areaH(),
      vx: (Math.random() - 0.5) * 1.5, // سرعت بیشتر
      vy: (Math.random() - 0.5) * 1.5,
      r: 3 + Math.random() * 4, // نورون بزرگ‌تر
    });
  }

  let mx = areaW() / 2,
    my = areaH() / 2;
  footer.addEventListener("mousemove", (e) => {
    const rect = footer.getBoundingClientRect();
    mx = e.clientX - rect.left;
    my = e.clientY - rect.top;
    footer.style.setProperty("--mx", (mx / areaW()) * 100 + "%");
    footer.style.setProperty("--my", (my / areaH()) * 100 + "%");
  });

  function animate() {
    ctx.clearRect(0, 0, areaW(), areaH());

    // حرکت نودها
    for (let n of nodes) {
      n.x += n.vx;
      n.y += n.vy;

      if (n.x < 0 || n.x > areaW()) n.vx *= -1;
      if (n.y < 0 || n.y > areaH()) n.vy *= -1;
    }

    // خطوط
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = Math.hypot(dx, dy);
        if (dist < 160) {
          const alpha = 1 - dist / 160;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(0,200,255,${alpha * 0.6})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
    }

    // رسم نودها
    for (let n of nodes) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 255, 255, 0.9)";
      ctx.shadowBlur = 12;
      ctx.shadowColor = "cyan";
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
