<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <footer id="neural-footer">
  <canvas id="neural-canvas"></canvas>

  <div class="footer-content">
    <span class="author">Hossein7 توسعه داده شده با ☕ توسط</span>
  </div>
</footer>

<style>
  #neural-footer {
    position: relative;
    height: clamp(140px, 18vh, 220px); /* ارتفاع داینامیک */
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Vazirmatn", sans-serif;
    font-size: 1rem;
    color: #fff;
  }

  /* تم روشن */
  body:not(.dark) #neural-footer {
    background: linear-gradient(135deg, #0a0f2c, #0d47a1, #1976d2);
  }

  /* تم تاریک */
  body.dark #neural-footer {
    background: linear-gradient(135deg, #050510, #120026, #1b003d);
  }

  .footer-content {
    position: relative;
    z-index: 2;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    font-weight: bold;
  }

  .author {
    color: #ffdd57;
  }

  #neural-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* اسپات لایت موس */
  #neural-footer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(0, 255, 255, 0.4) 0px,
      rgba(0, 200, 255, 0.2) 80px,
      rgba(0, 0, 0, 0) 180px
    );
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 2;
  }
  #neural-footer:hover::before {
    opacity: 1;
  }
</style>

<script>
(function () {
  const footer = document.getElementById("neural-footer");
  const canvas = document.getElementById("neural-canvas");
  const ctx = canvas.getContext("2d");

  let DPR = window.devicePixelRatio || 1;
  function resizeCanvas() {
    canvas.width = footer.clientWidth * DPR;
    canvas.height = footer.clientHeight * DPR;
    canvas.style.width = footer.clientWidth + "px";
    canvas.style.height = footer.clientHeight + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    initNodes(); // بازتولید نودها با توجه به ابعاد جدید
  }
  window.addEventListener("resize", resizeCanvas);

  let nodes = [];
  function initNodes() {
    nodes = [];
    const count = Math.floor(canvas.width / 70); // مقیاس داینامیک
    for (let i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * footer.clientWidth,
        y: Math.random() * footer.clientHeight,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        r: 2.5 + Math.random() * 3.5,
      });
    }
  }

  resizeCanvas();

  let mx = footer.clientWidth / 2,
    my = footer.clientHeight / 2;
  footer.addEventListener("mousemove", (e) => {
    const rect = footer.getBoundingClientRect();
    mx = e.clientX - rect.left;
    my = e.clientY - rect.top;
    footer.style.setProperty("--mx", (mx / footer.clientWidth) * 100 + "%");
    footer.style.setProperty("--my", (my / footer.clientHeight) * 100 + "%");
  });

  let running = true;
  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (running) requestAnimationFrame(animate);
  });

  function animate() {
    if (!running) return;
    ctx.clearRect(0, 0, footer.clientWidth, footer.clientHeight);

    // نودها
    for (let n of nodes) {
      n.x += n.vx;
      n.y += n.vy;
      if (n.x < 0 || n.x > footer.clientWidth) n.vx *= -1;
      if (n.y < 0 || n.y > footer.clientHeight) n.vy *= -1;
    }

    // خطوط
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = dx * dx + dy * dy;
        if (dist < 140 * 140) {
          const alpha = 1 - Math.sqrt(dist) / 140;
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);

          // رنگ بسته به تم
          ctx.strokeStyle = document.body.classList.contains("dark")
            ? `rgba(0,255,180,${alpha * 0.7})`
            : `rgba(0,200,255,${alpha * 0.7})`;

          ctx.lineWidth = 1.4;
          ctx.stroke();
        }
      }
    }

    // نودها
    for (let n of nodes) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);

      if (document.body.classList.contains("dark")) {
        ctx.fillStyle = "rgba(0,255,180,0.85)";
        ctx.shadowColor = "lime";
      } else {
        ctx.fillStyle = "rgba(0,255,255,0.9)";
        ctx.shadowColor = "cyan";
      }
      ctx.shadowBlur = 10;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
})();
</script>

</body>
</html>
