<!-- Header -->
<header class="">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><h2>Stand Blog<em>.</em></h2></a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
                    aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item {% if request.resolver_match.url_name == 'home_page' %}active{% endif %}">
                        <a class="nav-link" href={% url "main:home_page" %}>Home
                            <span class="sr-only">(current)</span>
                        </a>
                    </li>
                    <li class="nav-item {% if request.resolver_match.url_name == 'show_posts' %}active{% endif %}">
                        <a class="nav-link" href={% url "blog:show_posts" %}>Blog Entries</a>
                    </li>
                    <li class="nav-item {% if request.resolver_match.url_name == 'logout' and request.resolver_match.app_name == 'login' %}active{% endif %}">
                        {% if user.is_authenticated %}
                        <a class="nav-link" href={% url "login:logout" %}>Logout</a>
                    <li class="nav-item {% if request.resolver_match.url_name == 'home_page' %}active{% endif %}">
                        <a class="nav-link" href={% url "main:home_page" %}>
                        <button class="btn-danger">
                            {{ request.user.username }}</a>
                    </li>
                    {% else %}
                    <a class="nav-link" href={% url "login:login" %}>Login</a>
                    {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
